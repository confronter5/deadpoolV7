# Pair dashboard (Web Service)
services:
  - type: web
    name: deadpoolv7-pair
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DEV_LINK
        value: https://wa.me/254796283064
      - key: BOT_NAME
        value: Deadpool V7
      - key: POWERED_BY
        value: Powered by @confronter ©2026

  # Bot worker (optional second service — set SESSION in dashboard)
  - type: worker
    name: deadpoolv7-bot
    env: node
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: SESSION
        sync: false
      - key: OWNER_NUMBER
        sync: false
