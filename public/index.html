<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deadpool V7 — Pair</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    :root, [data-theme="dark"] {
      --bg: #0b0b0f;
      --card: #14141c;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --line: #1e1e2a;
      --accent: #e11d48;
      --accent2: #fb7185;
      --input: #0d0d14;
      --ok: #4ade80;
    }
    [data-theme="light"] {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --accent: #e11d48;
      --accent2: #be123c;
      --input: #f8fafc;
      --ok: #16a34a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%; max-width: 420px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 16px 40px rgba(0,0,0,.25);
      position: relative;
    }
    .theme-btn {
      position: absolute; top: 14px; right: 14px;
      background: var(--input); border: 1px solid var(--line);
      color: var(--text); width: 40px; height: 40px;
      border-radius: 50%; cursor: pointer; font-size: 1rem;
    }
    .logo { text-align: center; font-size: 2rem; color: var(--accent); margin-bottom: 6px; }
    h1 { margin: 0; text-align: center; font-size: 1.35rem; }
    .sub { text-align: center; color: var(--muted); font-size: .85rem; margin: 6px 0 16px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab {
      flex: 1; padding: 12px; text-align: center; cursor: pointer;
      border-radius: 12px; border: 1px solid var(--line);
      background: var(--input); color: var(--muted); font-weight: 600; font-size: .85rem;
    }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .panel { display: none; }
    .panel.active { display: block; }
    label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 6px; }
    input {
      width: 100%; padding: 13px 14px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--input);
      color: var(--text); font-size: 1rem; outline: none;
    }
    input:focus { border-color: var(--accent); }
    button.action {
      width: 100%; margin-top: 12px; padding: 13px;
      border: none; border-radius: 12px;
      background: var(--accent); color: #fff;
      font-weight: 700; font-size: .95rem; cursor: pointer;
    }
    button.action:disabled { opacity: .55; cursor: not-allowed; }
    button.secondary {
      width: 100%; margin-top: 8px; padding: 11px;
      border: 1px solid var(--line); border-radius: 12px;
      background: var(--input); color: var(--text);
      font-weight: 600; cursor: pointer;
    }
    .box {
      margin-top: 14px; padding: 14px; border-radius: 12px;
      background: var(--input); border: 1px solid var(--line);
      display: none;
    }
    .box.show { display: block; }
    .code-row {
      display: flex; align-items: center; gap: 8px;
      justify-content: center; margin: 10px 0;
    }
    .code {
      font-size: 1.5rem; letter-spacing: .2em; font-weight: 800;
      color: var(--accent2); font-family: ui-monospace, monospace;
    }
    .hint { color: var(--muted); font-size: .82rem; line-height: 1.45; }
    .ok { color: var(--ok); }
    .err { color: var(--accent2); }
    .qr-wrap { text-align: center; margin: 10px 0; }
    .qr-wrap img {
      width: 240px; max-width: 100%; border-radius: 12px;
      background: #fff; padding: 8px;
    }
    .session {
      word-break: break-all; font-size: .68rem;
      background: #000; color: #e2e8f0; padding: 10px;
      border-radius: 8px; max-height: 100px; overflow: auto; margin-top: 8px;
    }
    [data-theme="light"] .session { background: #0f172a; }
    .footer { text-align: center; margin-top: 16px; font-size: .78rem; color: var(--muted); }
    .footer a { color: var(--accent2); text-decoration: none; }

    .music {
      margin-top: 16px; padding: 12px;
      border: 1px solid var(--line); border-radius: 14px;
      background: var(--input);
    }
    .music-title {
      font-size: .8rem; color: var(--muted); margin-bottom: 8px;
      display: flex; align-items: center; gap: 8px;
    }
    .music-frame { display: none; }
    audio#bgAudio { width: 100%; margin-bottom: 8px; border-radius: 8px; }

    .music-controls { display: flex; gap: 8px; align-items: center; }
    .music-controls button {
      flex: 1; padding: 10px; border-radius: 10px; border: none;
      background: var(--accent); color: #fff; font-weight: 700; cursor: pointer;
    }
    .music-controls button.secondary {
      background: transparent; border: 1px solid var(--line); color: var(--text);
    }
    .music-now {
      font-size: .75rem; color: var(--ok); margin-top: 6px; min-height: 1.2em;
      display: flex; align-items: center; gap: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <button class="theme-btn" id="themeBtn" type="button" title="Toggle theme">
      <i class="fa-solid fa-moon"></i>
    </button>

    <div class="logo"><i class="fa-solid fa-skull"></i></div>
    <h1>Deadpool V7</h1>
    <p class="sub">Link device · Get session</p>

    <div class="tabs">
      <div class="tab active" data-tab="qr"><i class="fa-solid fa-qrcode"></i> QR Code</div>
      <div class="tab" data-tab="code"><i class="fa-solid fa-hashtag"></i> Pair Code</div>
    </div>

    <div id="panel-qr" class="panel active">
      <p class="hint">
        <i class="fa-solid fa-info-circle"></i>
        Generate QR → WhatsApp → Linked Devices → Link a device → Scan.
      </p>
      <button class="action" id="btnQr" type="button">
        <i class="fa-solid fa-qrcode"></i> Generate QR
      </button>
    </div>

    <div id="panel-code" class="panel">
      <label for="phone"><i class="fa-solid fa-phone"></i> Number (country code, no +)</label>
      <input id="phone" type="tel" placeholder="254712345678" />
      <button class="action" id="btnCode" type="button">
        <i class="fa-solid fa-key"></i> Get Pairing Code
      </button>
    </div>

    <div id="statusBox" class="box">
      <div id="statusText" class="hint"></div>
      <div id="qrWrap" class="qr-wrap" style="display:none">
        <img id="qrImg" alt="QR" />
      </div>
      <div id="codeRow" class="code-row" style="display:none">
        <span id="codeEl" class="code"></span>
        <button type="button" id="copyCodeBtn" class="secondary" style="width:auto;padding:8px 12px;margin:0">
          <i class="fa-regular fa-copy"></i> Copy
        </button>
      </div>
      <div id="sessionWrap" style="display:none">
        <p class="ok"><i class="fa-solid fa-circle-check"></i> Session ready</p>
        <div id="sessionEl" class="session"></div>
        <button type="button" id="copySessionBtn" class="secondary">
          <i class="fa-regular fa-copy"></i> Copy Session
        </button>
      </div>
    </div>


    <div class="music">
      <div class="music-title"><i class="fa-solid fa-music"></i> Music while you wait</div>
      <audio id="bgAudio" controls preload="auto"></audio>
      <div class="music-controls">
        <button type="button" id="playMusicBtn"><i class="fa-solid fa-play"></i> Play</button>
        <button type="button" id="pauseMusicBtn" class="secondary"><i class="fa-solid fa-pause"></i> Pause</button>
        <button type="button" id="nextMusicBtn" class="secondary"><i class="fa-solid fa-forward"></i> Next</button>
      </div>
      <div class="music-now" id="musicNow">
        <i class="fa-solid fa-compact-disc"></i>
        <span id="trackName">Loading…</span>
      </div>
    </div>

    <p class="footer">
      Powered by Confronter<br />
      <a href="https://wa.me/254796283064" target="_blank"><i class="fa-brands fa-whatsapp"></i> Support</a>
    </p>
  </div>

  <script>
    const root = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');
    const saved = localStorage.getItem('dp-theme') || 'dark';
    root.setAttribute('data-theme', saved);
    themeBtn.innerHTML = saved === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    themeBtn.onclick = () => {
      const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('dp-theme', next);
      themeBtn.innerHTML = next === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
    };

    document.querySelectorAll('.tab').forEach(t => {
      t.onclick = () => {
        document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById('panel-' + t.dataset.tab).classList.add('active');
      };
    });

    const statusBox = document.getElementById('statusBox');
    const statusText = document.getElementById('statusText');
    const qrWrap = document.getElementById('qrWrap');
    const qrImg = document.getElementById('qrImg');
    const codeRow = document.getElementById('codeRow');
    const codeEl = document.getElementById('codeEl');
    const sessionWrap = document.getElementById('sessionWrap');
    const sessionEl = document.getElementById('sessionEl');
    const btnQr = document.getElementById('btnQr');
    const btnCode = document.getElementById('btnCode');
    let pollTimer = null;

    function resetUI() {
      statusBox.classList.add('show');
      sessionWrap.style.display = 'none';
      qrWrap.style.display = 'none';
      codeRow.style.display = 'none';
    }

    let pairMode = 'qr';
    function poll(id) {
      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        try {
          const res = await fetch('/api/status/' + id);
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Expired');
          if (data.mode) pairMode = data.mode;

          // QR only for QR mode
          if (pairMode === 'qr' && data.qr) {
            qrImg.src = data.qr;
            qrWrap.style.display = 'block';
            codeRow.style.display = 'none';
            statusText.innerHTML = '<i class="fa-solid fa-camera"></i> Scan QR · you may switch to WhatsApp';
          }
          // Pair code only for code mode (never show QR)
          if (pairMode === 'code' && data.code) {
            codeEl.textContent = data.code;
            codeRow.style.display = 'flex';
            qrWrap.style.display = 'none';
            statusText.innerHTML = '<i class="fa-solid fa-mobile-screen"></i> Enter <b>code</b> on phone · Linked Devices → Link with phone number';
          }
          if (data.status === 'connected') {
            statusText.innerHTML = '<span class="ok"><i class="fa-solid fa-spinner fa-spin"></i> Linked · building session…</span>';
          }
          if (data.status === 'done' && data.session) {
            clearInterval(pollTimer);
            qrWrap.style.display = 'none';
            codeRow.style.display = 'none';
            sessionWrap.style.display = 'block';
            sessionEl.textContent = data.session;
            statusText.innerHTML = '<span class="ok"><i class="fa-solid fa-circle-check"></i> Done · also sent to your WhatsApp PM</span>';
            btnQr.disabled = false;
            btnCode.disabled = false;
          }
          if (data.status === 'error') {
            clearInterval(pollTimer);
            statusText.innerHTML = '<span class="err"><i class="fa-solid fa-circle-xmark"></i> ' + (data.error || 'Failed') + '</span>';
            btnQr.disabled = false;
            btnCode.disabled = false;
          }
        } catch (e) {
          clearInterval(pollTimer);
          statusText.innerHTML = '<span class="err">' + e.message + '</span>';
          btnQr.disabled = false;
          btnCode.disabled = false;
        }
      }, 1200);
    }

    btnQr.onclick = async () => {
      btnQr.disabled = true; btnCode.disabled = true;
      resetUI();
      pairMode = 'qr'; statusText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating QR…';
      try {
        const res = await fetch('/api/pair/qr', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed');
        poll(data.id);
      } catch (e) {
        statusText.innerHTML = '<span class="err">' + e.message + '</span>';
        btnQr.disabled = false; btnCode.disabled = false;
      }
    };

    btnCode.onclick = async () => {
      const num = document.getElementById('phone').value.trim();
      if (!num) return alert('Enter number');
      btnQr.disabled = true; btnCode.disabled = true;
      resetUI();
      pairMode = 'code'; statusText.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Requesting code…';
      try {
        const res = await fetch('/api/pair', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: num })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed');
        poll(data.id);
      } catch (e) {
        statusText.innerHTML = '<span class="err">' + e.message + '</span>';
        btnQr.disabled = false; btnCode.disabled = false;
      }
    };

    document.getElementById('copyCodeBtn').onclick = () => {
      const c = codeEl.textContent;
      navigator.clipboard.writeText(c).then(() => {
        statusText.innerHTML = '<span class="ok"><i class="fa-solid fa-check"></i> Code copied</span>';
      });
    };

    document.getElementById('copySessionBtn').onclick = () => {
      navigator.clipboard.writeText(sessionEl.textContent).then(() => {
        statusText.innerHTML = '<span class="ok"><i class="fa-solid fa-check"></i> Session copied</span>';
      });
    };

    // Real songs via server y2mate/vidmate-style YT→MP3 API
    let trackIdx = 0;
    let playlistLen = 10;
    const audio = document.getElementById('bgAudio');
    const trackName = document.getElementById('trackName');
    const musicNow = document.getElementById('musicNow');

    function setNow(name, playing) {
      const label = name || 'Music';
      if (musicNow) {
        musicNow.innerHTML = playing
          ? '<i class="fa-solid fa-compact-disc fa-spin"></i> <span id="trackName">' + label + '</span>'
          : '<i class="fa-solid fa-pause"></i> <span id="trackName">' + label + '</span>';
      }
    }

    async function loadTrack(i, autoplay) {
      trackIdx = i;
      setNow('Loading…', true);
      try {
        const res = await fetch('/api/music/' + i);
        const data = await res.json();
        if (!res.ok || !data.url) {
          setNow((data && data.name ? data.name + ' — ' : '') + 'unavailable, trying next…', false);
          // auto-skip to next
          setTimeout(() => loadTrack((data && data.next != null) ? data.next : (i + 1), autoplay), 800);
          return;
        }
        playlistLen = Math.max(playlistLen, (data.next || 0) + 1);
        audio.src = data.url;
        setNow(data.name, !!autoplay);
        if (autoplay) {
          try { await audio.play(); setNow(data.name, true); }
          catch { setNow(data.name + ' — tap Play', false); }
        }
      } catch (e) {
        setNow('Error — tap Next', false);
      }
    }

    audio.addEventListener('ended', () => loadTrack(trackIdx + 1, true));
    document.getElementById('playMusicBtn').onclick = () => {
      if (audio.src) {
        audio.play().then(() => {
          const n = document.getElementById('trackName');
          setNow(n ? n.textContent : 'Playing', true);
        }).catch(() => loadTrack(trackIdx, true));
      } else loadTrack(trackIdx, true);
    };
    document.getElementById('pauseMusicBtn').onclick = () => {
      audio.pause();
      const n = document.getElementById('trackName');
      setNow(n ? n.textContent : 'Paused', false);
    };
    document.getElementById('nextMusicBtn').onclick = () => loadTrack(trackIdx + 1, true);

    // Auto-start first song
    setTimeout(() => loadTrack(0, true), 500);
  </script>
</body>
</html>
